privacy.title=Política de Privacidade
privacy.updated=Última atualização: 12 de junho de 2026
privacy.s1.title=1. Sobre esta política
privacy.s1.p1=Esta política explica como o aplicativo Campos Personalizados trata dados ao ser instalado e utilizado em uma loja Nuvemshop.
privacy.s1.p2=O Campos Personalizados é responsável pelo tratamento realizado diretamente para a prestação do aplicativo. A Nuvemshop possui suas próprias responsabilidades e políticas para os dados tratados em sua plataforma.
privacy.s2.title=2. Dados tratados
privacy.s2.p1=Podemos tratar o identificador e nome da loja, token de acesso, permissões concedidas, plano contratado, informações de cobrança, configurações de campos personalizados, produtos associados, preferências visuais, logs técnicos e mensagens enviadas ao suporte.
privacy.s2.p2=Quando autorizado pela loja, o aplicativo consulta produtos, scripts, webhooks e pedidos pela API da Nuvemshop. Nos pedidos, a leitura é limitada às informações necessárias para apresentar relatórios sobre personalizações.
privacy.s3.title=3. Dados de clientes da loja
privacy.s3.p1=Os valores preenchidos pelos consumidores nos campos personalizados são enviados à própria loja por meio dos recursos de carrinho e pedido da Nuvemshop. O aplicativo não mantém uma base própria desses valores, salvo quando informações forem voluntariamente incluídas em uma mensagem de suporte ou log técnico.
privacy.s4.title=4. Finalidades
privacy.s4.p1=Usamos os dados para autenticar a loja, fornecer e personalizar o serviço, aplicar limites do plano, registrar scripts e webhooks, processar assinaturas, apresentar relatórios, prevenir falhas, prestar suporte e cumprir obrigações legais.
privacy.s5.title=5. Compartilhamento
privacy.s5.p1=Os dados podem ser processados pela Nuvemshop e por fornecedores de infraestrutura estritamente necessários à operação, hospedagem, banco de dados e monitoramento. Não vendemos dados pessoais nem os utilizamos para publicidade de terceiros.
privacy.s6.title=6. Retenção e exclusão
privacy.s6.p1=Os dados permanecem armazenados enquanto a integração estiver ativa e pelo período necessário para suporte, auditoria, segurança e obrigações legais. Após a desinstalação, o token e os escopos de acesso são apagados imediatamente. Ao receber da Nuvemshop uma solicitação <code>store/redact</code>, o app exclui definitivamente os registros vinculados à loja.
privacy.s7.title=7. Segurança
privacy.s7.p1=Adotamos controles técnicos e organizacionais razoáveis, incluindo acesso restrito, comunicação HTTPS e validação de assinaturas de webhooks. Nenhum sistema é totalmente imune a incidentes, mas trabalhamos para reduzir riscos e responder adequadamente.
privacy.s8.title=8. Direitos e contato
privacy.s8.p1=A loja e os titulares podem solicitar confirmação do tratamento, acesso, correção, portabilidade, oposição ou eliminação de dados, quando esses direitos forem aplicáveis e respeitadas as obrigações legais e técnicas.
