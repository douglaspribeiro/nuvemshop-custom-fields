spring:
  application:
    name: nuvemshop-custom-fields
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:app-custom-fields}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&serverTimezone=America/Sao_Paulo}
    username: ${DB_USER:${MYSQL_USER:}}
    password: ${DB_PASSWORD:${MYSQL_PASS:}}
  flyway:
    enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        same-site: none
        secure: true
  tomcat:
    use-relative-redirects: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

nuvemshop:
  client-id: ${NUVEMSHOP_CLIENT_ID:33395}
  client-secret: ${NUVEMSHOP_CLIENT_SECRET:AAAAABBCC}
  redirect-uri: ${NUVEMSHOP_REDIRECT_URI:http://localhost:8080/oauth/callback}
  auth-url: ${NUVEMSHOP_AUTH_URL:https://www.tiendanube.com/apps/{clientId}/authorize}
  token-url: ${NUVEMSHOP_TOKEN_URL:https://www.tiendanube.com/apps/authorize/token}
  api-base-url: ${NUVEMSHOP_API_BASE_URL:https://api.tiendanube.com}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  scopes: ${NUVEMSHOP_SCOPES:read_products,read_orders,write_scripts,read_scripts,billing,read_store}
  user-agent: ${NUVEMSHOP_USER_AGENT:NuvemCustomFields suporte@example.com}
  script-id: ${NUVEMSHOP_SCRIPT_ID:}
  checkout-script-id: ${NUVEMSHOP_CHECKOUT_SCRIPT_ID:}
  billing:
    enabled: ${NUVEMSHOP_BILLING_ENABLED:false}
    api-base-url: ${NUVEMSHOP_BILLING_API_BASE_URL:https://api.tiendanube.com/2025-03}
    concept-code: ${NUVEMSHOP_BILLING_CONCEPT_CODE:}

shopify:
  client-id: ${SHOPIFY_CLIENT_ID:5b23ef403cc1795c5f362e7b4291a0df}
  client-secret: ${SHOPIFY_CLIENT_SECRET:change-me}
  scopes: ${SHOPIFY_SCOPES:write_app_proxy,read_customers,write_customers,read_orders,write_orders,read_products,write_products,read_themes}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  api-version: ${SHOPIFY_API_VERSION:2026-04}

backoffice:
  username: ${BACKOFFICE_USERNAME:useradmin}
  password: ${BACKOFFICE_PASSWORD:useradmin}

logging:
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    br.com.nuvemcustomfields: DEBUG
