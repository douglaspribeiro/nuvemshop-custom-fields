spring:
  application:
    name: nuvemshop-custom-fields
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:app-custom-fields}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&serverTimezone=America/Sao_Paulo}
    username: ${DB_USER:${MYSQL_USER:}}
    password: ${DB_PASSWORD:${MYSQL_PASS:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  messages:
    basename: messages
    encoding: UTF-8
    # false: sem esta linha, uma loja pt-BR cairia no locale do servidor em vez do bundle padrao.
    fallback-to-system-locale: false

app:
  version: '@project.version@'

analytics:
  ga4:
    measurement-id: ${GA4_MEASUREMENT_ID:G-RM8VWNPDT8}
    api-secret: ${GA4_API_SECRET:}

legal:
  operator-name: ${LEGAL_OPERATOR_NAME:}
  document: ${LEGAL_DOCUMENT:}
  support-email: ${SUPPORT_EMAIL:contato@wzhub.pro}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        same-site: none
        secure: true
  tomcat:
    use-relative-redirects: true

management:
  # Este endpoint deve ficar acessivel somente ao Prometheus (rede interna/proxy).
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

nuvemshop:
  client-id: ${NUVEMSHOP_CLIENT_ID:change-me}
  client-secret: ${NUVEMSHOP_CLIENT_SECRET:change-me}
  redirect-uri: ${NUVEMSHOP_REDIRECT_URI:http://localhost:8080/oauth/callback}
  auth-url: ${NUVEMSHOP_AUTH_URL:https://www.nuvemshop.com.br/apps/{clientId}/authorize}
  token-url: ${NUVEMSHOP_TOKEN_URL:https://www.nuvemshop.com.br/apps/authorize/token}
  api-base-url: ${NUVEMSHOP_API_BASE_URL:https://api.nuvemshop.com.br}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  scopes: ${NUVEMSHOP_SCOPES:read_products,read_orders,write_scripts,read_scripts,billing,read_store}
  user-agent: ${NUVEMSHOP_USER_AGENT:NuvemCustomFields suporte@example.com}
  script-id: ${NUVEMSHOP_SCRIPT_ID:}
  checkout-script-id: ${NUVEMSHOP_CHECKOUT_SCRIPT_ID:}
  storefront-sdk-script-id: ${NUVEMSHOP_STOREFRONT_SDK_SCRIPT_ID:}
  billing:
    # A cobrança recorrente do produto é processada pela Efí. Só habilite o
    # billing nativo da Nuvemshop se o conceito de assinatura tiver sido criado
    # e aprovado para este aplicativo.
    enabled: ${NUVEMSHOP_BILLING_ENABLED:false}
    api-base-url: ${NUVEMSHOP_BILLING_API_BASE_URL:https://api.nuvemshop.com.br/2025-03}
    concept-code: ${NUVEMSHOP_BILLING_CONCEPT_CODE:app-cost}
    currency: ${NUVEMSHOP_BILLING_CURRENCY:BRL}
    premium-external-id: ${NUVEMSHOP_BILLING_PREMIUM_EXTERNAL_ID:premium-999}
    premium-plus-external-id: ${NUVEMSHOP_BILLING_PREMIUM_PLUS_EXTERNAL_ID:premium-plus-1999}
    premium-ultra-external-id: ${NUVEMSHOP_BILLING_PREMIUM_ULTRA_EXTERNAL_ID:premium-ultra-5990}
    premium-amount: ${NUVEMSHOP_BILLING_PREMIUM_AMOUNT:19.99}
    premium-plus-amount: ${NUVEMSHOP_BILLING_PREMIUM_PLUS_AMOUNT:29.99}
    premium-ultra-amount: ${NUVEMSHOP_BILLING_PREMIUM_ULTRA_AMOUNT:59.90}
    prices:
      BR:
        currency: BRL
        premium-amount: ${NUVEMSHOP_BILLING_BR_PREMIUM_AMOUNT:${NUVEMSHOP_BILLING_PREMIUM_AMOUNT:19.99}}
        premium-plus-amount: ${NUVEMSHOP_BILLING_BR_PREMIUM_PLUS_AMOUNT:${NUVEMSHOP_BILLING_PREMIUM_PLUS_AMOUNT:29.99}}
        premium-ultra-amount: ${NUVEMSHOP_BILLING_BR_PREMIUM_ULTRA_AMOUNT:${NUVEMSHOP_BILLING_PREMIUM_ULTRA_AMOUNT:59.90}}
      AR:
        currency: ARS
        premium-amount: ${NUVEMSHOP_BILLING_AR_PREMIUM_AMOUNT:5599}
        premium-plus-amount: ${NUVEMSHOP_BILLING_AR_PREMIUM_PLUS_AMOUNT:8399}
        premium-ultra-amount: ${NUVEMSHOP_BILLING_AR_PREMIUM_ULTRA_AMOUNT:16799}
      CL:
        currency: CLP
        premium-amount: ${NUVEMSHOP_BILLING_CL_PREMIUM_AMOUNT:4199}
        premium-plus-amount: ${NUVEMSHOP_BILLING_CL_PREMIUM_PLUS_AMOUNT:6299}
        premium-ultra-amount: ${NUVEMSHOP_BILLING_CL_PREMIUM_ULTRA_AMOUNT:12599}
      MX:
        currency: MXN
        premium-amount: ${NUVEMSHOP_BILLING_MX_PREMIUM_AMOUNT:99}
        premium-plus-amount: ${NUVEMSHOP_BILLING_MX_PREMIUM_PLUS_AMOUNT:149}
        premium-ultra-amount: ${NUVEMSHOP_BILLING_MX_PREMIUM_ULTRA_AMOUNT:299}
      US:
        currency: USD
        premium-amount: ${NUVEMSHOP_BILLING_US_PREMIUM_AMOUNT:4.99}
        premium-plus-amount: ${NUVEMSHOP_BILLING_US_PREMIUM_PLUS_AMOUNT:7.49}
        premium-ultra-amount: ${NUVEMSHOP_BILLING_US_PREMIUM_ULTRA_AMOUNT:14.99}
      CO:
        currency: COP
        premium-amount: ${NUVEMSHOP_BILLING_CO_PREMIUM_AMOUNT:13146}
        premium-plus-amount: ${NUVEMSHOP_BILLING_CO_PREMIUM_PLUS_AMOUNT:19723}
        premium-ultra-amount: ${NUVEMSHOP_BILLING_CO_PREMIUM_ULTRA_AMOUNT:39446}

backoffice:
  username: ${BACKOFFICE_USERNAME:admin}
  password: ${BACKOFFICE_PASSWORD:admin}

payments:
  upgrade:
    reconcile-delay-ms: ${UPGRADE_RECONCILE_DELAY_MS:60000}
  reconciliation-delay-ms: ${PAYMENTS_RECONCILIATION_DELAY_MS:3600000}
  efi:
    enabled: ${EFI_ENABLED:false}
    sandbox: ${EFI_SANDBOX:true}
    client-id: ${EFI_CLIENT_ID:}
    client-secret: ${EFI_CLIENT_SECRET:}
    payee-code: ${EFI_PAYEE_CODE:}
    premium-plan-id: ${EFI_PREMIUM_PLAN_ID:}
    premium-plus-plan-id: ${EFI_PREMIUM_PLUS_PLAN_ID:}
    premium-ultra-plan-id: ${EFI_PREMIUM_ULTRA_PLAN_ID:}
    premium-amount: ${EFI_PREMIUM_AMOUNT:19.99}
    premium-plus-amount: ${EFI_PREMIUM_PLUS_AMOUNT:29.99}
    premium-ultra-amount: ${EFI_PREMIUM_ULTRA_AMOUNT:59.90}
  mercado-pago:
    enabled: ${MERCADO_PAGO_ENABLED:false}
    api-base-url: ${MERCADO_PAGO_API_BASE_URL:https://api.mercadopago.com}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    grace-days: ${MERCADO_PAGO_GRACE_DAYS:0}
    premium-amount: ${MERCADO_PAGO_PREMIUM_AMOUNT:19.99}
    premium-plus-amount: ${MERCADO_PAGO_PREMIUM_PLUS_AMOUNT:29.99}
    premium-ultra-amount: ${MERCADO_PAGO_PREMIUM_ULTRA_AMOUNT:59.90}
  creem:
    enabled: ${CREEM_ENABLED:false}
    sandbox: ${CREEM_SANDBOX:true}
    api-key: ${CREEM_API_KEY:}
    webhook-secret: ${CREEM_WEBHOOK_SECRET:}
    grace-days: ${CREEM_GRACE_DAYS:3}
    timeout-seconds: ${CREEM_TIMEOUT_SECONDS:20}
  paddle:
    enabled: ${PADDLE_ENABLED:false}
    sandbox: ${PADDLE_SANDBOX:true}
    api-base-url: ${PADDLE_API_BASE_URL:https://sandbox-api.paddle.com}
    api-key: ${PADDLE_API_KEY:}
    client-side-token: ${PADDLE_CLIENT_SIDE_TOKEN:}
    webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
    api-version: ${PADDLE_API_VERSION:1}
    grace-days: ${PADDLE_GRACE_DAYS:3}
    webhook-tolerance-seconds: ${PADDLE_WEBHOOK_TOLERANCE_SECONDS:300}
    checkout-token-minutes: ${PADDLE_CHECKOUT_TOKEN_MINUTES:30}

notifications:
  ses-events:
    enabled: ${AWS_SES_EVENTS_ENABLED:false}
    queue-url: ${AWS_SES_EVENTS_QUEUE_URL:}
    region: ${AWS_SES_EVENTS_REGION:us-east-1}
    configuration-set: ${AWS_SES_CONFIGURATION_SET:}
    poll-delay-ms: 10000
  ses:
    # AWS SES SMTP com STARTTLS. Configuração incompleta desativa o envio.
    host: ${AWS_SES_SMTP_HOST:}
    port: ${AWS_SES_SMTP_PORT:587}
    username: ${AWS_SES_SMTP_USERNAME:}
    password: ${AWS_SES_SMTP_PASSWORD:}
    from: ${AWS_SES_FROM_EMAIL:}
  discord:
    payment-webhook-url: ${DISCORD_PAYMENT_WEBHOOK_URL:}
    support-webhook-url: ${DISCORD_SUPPORT_WEBHOOK_URL:${DISCORD_PAYMENT_WEBHOOK_URL:}}

winback:
  discount:
    enabled: ${WINBACK_DISCOUNT_ENABLED:false}
    allow-production: ${WINBACK_DISCOUNT_ALLOW_PRODUCTION:false}
  enabled: ${WINBACK_ENABLED:false}
  mail-enabled: ${WINBACK_MAIL_ENABLED:false}
  queue-url: ${WINBACK_SQS_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/265105089924/eventosDesistalacao}
  region: ${WINBACK_AWS_REGION:us-east-2}
  # Durante os testes, somente estas lojas entram na reconquista. Use 0 para todas.
  allowed-store-ids: ${WINBACK_ALLOWED_STORE_IDS:8289259,8126986,7800303,7799255,5538394}
  publish-delay-ms: 30000

logging:
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    br.com.nuvemcustomfields: DEBUG

images:
  s3:
    bucket: ${IMAGES_S3_BUCKET:}
    region: ${IMAGES_S3_REGION:us-east-2}
    prefix: ${IMAGES_S3_PREFIX:production/options}
  cleanup-delay-ms: ${IMAGES_CLEANUP_DELAY_MS:60000}
