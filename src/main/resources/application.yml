spring:
  application:
    name: nuvemshop-custom-fields
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nuvem_custom_fields?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  forward-headers-strategy: framework

nuvemshop:
  client-id: ${NUVEMSHOP_CLIENT_ID:change-me}
  client-secret: ${NUVEMSHOP_CLIENT_SECRET:change-me}
  redirect-uri: ${NUVEMSHOP_REDIRECT_URI:http://localhost:8080/oauth/callback}
  auth-url: ${NUVEMSHOP_AUTH_URL:https://www.tiendanube.com/apps/{clientId}/authorize}
  token-url: ${NUVEMSHOP_TOKEN_URL:https://www.tiendanube.com/apps/authorize/token}
  api-base-url: ${NUVEMSHOP_API_BASE_URL:https://api.tiendanube.com}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  scopes: ${NUVEMSHOP_SCOPES:read_products,write_scripts,read_scripts,billing,read_store}
  user-agent: ${NUVEMSHOP_USER_AGENT:NuvemCustomFields suporte@example.com}
