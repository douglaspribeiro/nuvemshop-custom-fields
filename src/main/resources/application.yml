spring:
  application:
    name: nuvemshop-custom-fields
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:app-custom-fields}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&serverTimezone=America/Sao_Paulo}
    username: ${DB_USER:${MYSQL_USER:}}
    password: ${DB_PASSWORD:${MYSQL_PASS:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    # false: sem esta linha, uma loja pt-BR cairia no locale do servidor em vez do bundle padrao.
    fallback-to-system-locale: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        same-site: none
        secure: true
  tomcat:
    use-relative-redirects: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

nuvemshop:
  client-id: ${NUVEMSHOP_CLIENT_ID:change-me}
  client-secret: ${NUVEMSHOP_CLIENT_SECRET:change-me}
  redirect-uri: ${NUVEMSHOP_REDIRECT_URI:http://localhost:8080/oauth/callback}
  auth-url: ${NUVEMSHOP_AUTH_URL:https://www.nuvemshop.com.br/apps/{clientId}/authorize}
  token-url: ${NUVEMSHOP_TOKEN_URL:https://www.nuvemshop.com.br/apps/authorize/token}
  api-base-url: ${NUVEMSHOP_API_BASE_URL:https://api.nuvemshop.com.br}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
  scopes: ${NUVEMSHOP_SCOPES:read_products,read_orders,write_scripts,read_scripts,billing,read_store}
  user-agent: ${NUVEMSHOP_USER_AGENT:NuvemCustomFields suporte@example.com}
  script-id: ${NUVEMSHOP_SCRIPT_ID:}
  checkout-script-id: ${NUVEMSHOP_CHECKOUT_SCRIPT_ID:}
  storefront-sdk-script-id: ${NUVEMSHOP_STOREFRONT_SDK_SCRIPT_ID:}
  billing:
    enabled: ${NUVEMSHOP_BILLING_ENABLED:true}
    api-base-url: ${NUVEMSHOP_BILLING_API_BASE_URL:https://api.nuvemshop.com.br/2025-03}
    concept-code: ${NUVEMSHOP_BILLING_CONCEPT_CODE:app-cost}
    currency: ${NUVEMSHOP_BILLING_CURRENCY:BRL}
    premium-external-id: ${NUVEMSHOP_BILLING_PREMIUM_EXTERNAL_ID:premium-999}
    premium-plus-external-id: ${NUVEMSHOP_BILLING_PREMIUM_PLUS_EXTERNAL_ID:premium-plus-1999}
    premium-amount: ${NUVEMSHOP_BILLING_PREMIUM_AMOUNT:19.99}
    premium-plus-amount: ${NUVEMSHOP_BILLING_PREMIUM_PLUS_AMOUNT:29.99}
    prices:
      BR:
        currency: BRL
        premium-amount: ${NUVEMSHOP_BILLING_BR_PREMIUM_AMOUNT:${NUVEMSHOP_BILLING_PREMIUM_AMOUNT:19.99}}
        premium-plus-amount: ${NUVEMSHOP_BILLING_BR_PREMIUM_PLUS_AMOUNT:${NUVEMSHOP_BILLING_PREMIUM_PLUS_AMOUNT:29.99}}
      AR:
        currency: ARS
        premium-amount: ${NUVEMSHOP_BILLING_AR_PREMIUM_AMOUNT:5747}
        premium-plus-amount: ${NUVEMSHOP_BILLING_AR_PREMIUM_PLUS_AMOUNT:8622}
      CL:
        currency: CLP
        premium-amount: ${NUVEMSHOP_BILLING_CL_PREMIUM_AMOUNT:3566}
        premium-plus-amount: ${NUVEMSHOP_BILLING_CL_PREMIUM_PLUS_AMOUNT:5350}
      MX:
        currency: MXN
        premium-amount: ${NUVEMSHOP_BILLING_MX_PREMIUM_AMOUNT:67.49}
        premium-plus-amount: ${NUVEMSHOP_BILLING_MX_PREMIUM_PLUS_AMOUNT:101.26}
      CO:
        currency: COP
        premium-amount: ${NUVEMSHOP_BILLING_CO_PREMIUM_AMOUNT:13146}
        premium-plus-amount: ${NUVEMSHOP_BILLING_CO_PREMIUM_PLUS_AMOUNT:19723}

backoffice:
  username: ${BACKOFFICE_USERNAME:admin}
  password: ${BACKOFFICE_PASSWORD:admin}

logging:
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    br.com.nuvemcustomfields: DEBUG
