<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sugestões dos lojistas</title><link rel="stylesheet" th:href="@{/styles/app.css}">    <th:block th:replace="~{fragments/local-time :: script}"></th:block>
</head><body class="backoffice-page"><main class="backoffice-shell">
<header class="backoffice-header"><div><h1>Sugestões dos lojistas</h1><p>Últimas 100 melhorias solicitadas. Não são chamados de suporte nem compromissos de entrega.</p></div><a class="button" th:href="@{/backoffice/support}">Voltar ao suporte</a></header>
<section class="backoffice-directory"><p th:if="${#lists.isEmpty(suggestions)}">Nenhuma sugestão registrada.</p><article th:each="s:${suggestions}"><h2 th:text="'#'+${s.id}+' · '+${s.title}"></h2><p th:text="'Loja '+${s.storeId}+' · Plano '+${s.planAtSubmission.displayName}"></p><p style="white-space:pre-wrap" th:text="${s.description}"></p><p th:text="${s.discordSentAt==null ? 'Discord: envio pendente' : 'Discord: enviado'}"></p><p th:attr="data-local-time=${s.createdAt}" data-time-format="datetime" th:text="${#temporals.format(s.createdAt,'dd/MM/yyyy HH:mm','America/Sao_Paulo')}"></p><hr></article></section>
</main></body></html>
