<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/analytics :: googleAnalytics}"></th:block>
    <title>Backoffice - Lojas</title>
    <link rel="stylesheet" th:href="@{/styles/app.css}">
</head>
<body>
<main class="shell">
    <section class="page-header">
        <div>
            <p class="eyebrow">Backoffice</p>
            <h1>Lojas</h1>
        </div>
        <a class="button" th:href="@{/backoffice}">Voltar</a>
    </section>
    <p class="notice" th:if="${message}" th:text="${message}">Mensagem</p>
    <p class="notice error" th:if="${error}" th:text="${error}">Erro</p>
    <section class="panel">
        <table class="table">
            <thead>
            <tr>
                <th>Loja</th>
                <th>Store ID</th>
                <th>Mercado</th>
                <th>Plano</th>
                <th>Status</th>
                <th>Instalada em</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="store : ${stores}">
                <td th:text="${store.storeName ?: 'Loja sem nome'}">Loja</td>
                <td th:text="${store.storeId}">0</td>
                <td th:text="${(store.storeCountryCode ?: '-') + ' / ' + (store.storeCurrency ?: '-')}">BR / BRL</td>
                <td>
                    <span th:text="${store.plan.displayName}">FREE</span>
                    <span class="badge" th:if="${store.courtesyPremium}">Cortesia</span>
                </td>
                <td th:text="${store.active ? 'Ativa' : 'Desinstalada'}">Ativa</td>
                <td th:text="${#temporals.format(store.installedAt, 'dd/MM/yyyy HH:mm')}">02/06/2026</td>
                <td>
                    <div class="row-actions">
                        <form th:if="${store.active}" th:action="@{/backoffice/stores/{storeId}/enter(storeId=${store.storeId})}" method="post">
                            <button class="button small primary" type="submit">Modo loja</button>
                        </form>
                        <a class="button small" th:href="@{/backoffice/stores/{storeId}(storeId=${store.storeId})}">Detalhe</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
