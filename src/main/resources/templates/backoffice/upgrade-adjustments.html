<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ajustes de upgrade</title><link rel="stylesheet" th:href="@{/styles/app.css}"></head>
<body class="backoffice-page"><main class="backoffice-shell"><header class="backoffice-header"><div><h1>Ajustes de upgrade</h1><p>Últimas 100 tentativas de ajuste proporcional. Não são novas assinaturas.</p></div><a class="button" th:href="@{/backoffice/payments}">Voltar para pagamentos</a></header>
<section class="backoffice-directory"><p th:if="${#lists.isEmpty(adjustments)}">Nenhuma tentativa de pagamento de upgrade.</p>
<article th:each="a:${adjustments}"><h2 th:text="'Loja '+${a.storeId}+' · '+${a.sourcePlan.displayName}+' → '+${a.targetPlan.displayName}"></h2>
<p th:text="'Estado: '+${a.state}+' · Ambiente: '+${a.environment}"></p><p th:text="'Ajuste: R$ '+${#numbers.formatDecimal(a.dueAmount,1,'POINT',2,'COMMA')}+' · Cupom: '+${a.couponCode==null ? 'nenhum' : a.couponCode}"></p>
<p th:text="'Assinatura original: '+${a.subscriptionId}+' · Cobrança avulsa: '+${a.chargeId==null ? 'a confirmar' : a.chargeId}"></p><p th:text="'Referência: '+${a.reference()}"></p>
<p th:if="${a.message!=null}" th:text="${a.message}"></p><p th:if="${a.state.name()=='REVIEW'}">Requer conferência humana na Efí. Não inicie uma nova cobrança para resolver esta tentativa.</p><hr></article></section></main></body></html>
