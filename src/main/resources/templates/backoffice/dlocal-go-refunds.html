<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reembolsos dLocal Go</title><link rel="stylesheet" th:href="@{/styles/app.css(v=${assetVersion})}"></head>
<body><main class="shell"><section class="panel"><h1>Reembolsos dLocal Go · ARS</h1><p th:if="${error}" th:text="${error}"></p><p th:if="${message}" th:text="${message}"></p>
<th:block th:if="${operation!=null}"><h2>Revisar reembolso</h2><p th:text="'Loja '+${operation.storeId}+' · '+${operation.environment}+' · ARS '+${operation.dueAmount}"></p><p th:text="'Cobrança: '+${operation.invoiceId}"></p><p th:text="'Estado: '+${operation.state}"></p>
<p>O reembolso total da mensalidade atual suspende o acesso. Um reembolso parcial preserva o acesso. Reembolsar um ciclo antigo não retira um período mais recente já pago.</p>
<form th:if="${operation.state.name()=='QUOTED'}" method="post" th:action="@{/backoffice/payments/dlocal-go/refunds/{id}/execute(id=${operation.id})}"><button class="button" type="submit">Confirmar reembolso</button></form></th:block>
<form th:if="${operation==null}" method="post" th:action="@{/backoffice/payments/dlocal-go/refunds/quote}"><label>Loja<input name="storeId" type="number" min="1" required></label><label>Cobrança<input name="invoiceId" placeholder="plano:assinatura:execução ou upgrade:ID" required></label><label>Valor em ARS<input name="amount" type="number" min="0.01" step="0.01" required></label><button class="button" type="submit">Revisar reembolso</button></form>
<table th:if="${operations!=null}"><thead><tr><th>Loja</th><th>Tipo</th><th>Ambiente</th><th>Valor ARS</th><th>Estado</th><th>Identificador</th></tr></thead><tbody><tr th:each="op:${operations}"><td th:text="${op.storeId}"></td><td th:text="${op.kind}"></td><td th:text="${op.environment}"></td><td th:text="${op.dueAmount}"></td><td th:text="${op.state}"></td><td><a th:if="${op.kind.name()=='REFUND'}" th:href="@{/backoffice/payments/dlocal-go/refunds/{id}(id=${op.id})}" th:text="${op.id}"></a><span th:unless="${op.kind.name()=='REFUND'}" th:text="'upgrade:'+${op.id}"></span></td></tr></tbody></table>
<a class="button" th:href="@{/backoffice/payments}">Voltar aos pagamentos</a></section></main></body></html>
