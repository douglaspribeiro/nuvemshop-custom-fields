<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title th:text="#{winback.page.title}"></title>
    <link rel="stylesheet" th:href="@{/styles/app.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/styles/winback.css(v=${assetVersion})}">
    <th:block th:replace="~{fragments/local-time :: script}"></th:block>
</head>
<body class="winback-page">
<main class="shell winback-shell">
    <p class="winback-brand">Campos Personalizados</p>
    <section class="panel winback-card" aria-labelledby="thanks-title">
        <header class="winback-heading">
            <p class="eyebrow" th:text="#{winback.feedback.eyebrow}"></p>
            <h1 id="thanks-title" th:text="${optedOut} ? #{winback.optout.title} : #{winback.thanks.title}"></h1>
            <p th:text="${optedOut} ? #{winback.optout.description} : #{winback.thanks.description}"></p>
        </header>
        <th:block th:replace="~{winback/fragments :: coupon}"></th:block>
        <a class="button" th:href="@{/install}" th:text="#{winback.back}"></a>
    </section>
</main>
</body>
</html>
