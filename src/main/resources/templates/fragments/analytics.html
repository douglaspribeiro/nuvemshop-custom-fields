<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="googleAnalytics" th:if="${ga4MeasurementId != null and !#strings.isEmpty(ga4MeasurementId)}">
    <!-- Google tag (gtag.js) -->
    <script async th:src="@{https://www.googletagmanager.com/gtag/js(id=${ga4MeasurementId})}"></script>
    <script th:inline="javascript">
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        // URLs de OAuth e billing podem ter parâmetros sensíveis; não os envie ao GA.
        gtag('config', /*[[${ga4MeasurementId}]]*/ '', {
            page_location: window.location.origin + window.location.pathname,
            page_referrer: '',
            allow_google_signals: false,
            allow_ad_personalization_signals: false
        });
    </script>
</th:block>
<th:block th:fragment="billingEvents(step)">
    <script th:inline="javascript">
        window.billingAnalytics = {
            measurementId: /*[[${ga4MeasurementId}]]*/ '',
            step: /*[[${step}]]*/ '',
            flow: /*[[${upgradeAdjustment != null or targetPlan != null ? 'upgrade' : 'subscription'}]]*/ 'subscription',
            plan: /*[[${upgradeAdjustment != null ? upgradeAdjustment.targetPlan.name() : (targetPlan != null ? targetPlan.name() : (plan != null ? plan.name() : analyticsPlan))}]]*/ null,
            sourcePlan: /*[[${upgradeAdjustment != null ? upgradeAdjustment.sourcePlan.name() : (store != null ? store.effectivePlan.name() : null)}]]*/ null,
            provider: /*[[${analyticsProvider}]]*/ null,
            currency: /*[[${analyticsCurrency}]]*/ null,
            amount: /*[[${upgradeAdjustment != null ? upgradeAdjustment.dueAmount : amount}]]*/ null,
            recurringAmount: /*[[${upgradeAdjustment != null ? upgradeAdjustment.regularAmount : analyticsRecurringAmount}]]*/ null,
            coupon: /*[[${upgradeAdjustment != null ? upgradeAdjustment.couponCode : couponCode}]]*/ null,
            sandbox: /*[[${efiEnvironment == 'sandbox' or analyticsSandbox == true}]]*/ false,
            hasError: /*[[${error != null}]]*/ false
        };
    </script>
    <script defer th:src="@{/assets/billing-analytics.js(v=${assetVersion})}"></script>
</th:block>
</body>
</html>
