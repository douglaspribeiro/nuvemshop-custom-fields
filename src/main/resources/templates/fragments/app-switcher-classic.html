<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<aside class="apps-sidebar" th:fragment="switcher(current)">
    <p class="apps-sidebar-title" th:text="#{complements.apps}">Aplicativos</p>
    <details open class="apps-switcher">
        <summary>
            <span th:text="${current == 'complements'} ? #{complements.title} : #{complements.nc}">Campos Personalizados</span>
        </summary>
        <nav th:aria-label="#{complements.apps}">
            <a th:href="@{/admin}" class="apps-row">
                <span th:text="#{complements.nc}">Campos Personalizados</span>
                <small th:text="#{complements.open}">Abrir</small>
            </a>
            <a th:if="${productComplementsVisible}" th:href="@{/admin/apps/complements}" class="apps-row" th:aria-current="${current == 'complements'} ? 'page'">
                <span th:text="#{complements.title}">Complementos de Produto</span>
                <small th:text="${current == 'complements'} ? #{complements.current} : #{complements.open}">Abrir</small>
            </a>
            <details class="apps-discover">
                <summary th:text="#{complements.favorites}">Favoritos</summary>
                <p th:text="#{complements.favorites.detail}"></p>
            </details>
            <details class="apps-discover">
                <summary th:text="#{complements.restock}">Avise-me</summary>
                <p th:text="#{complements.restock.detail}"></p>
            </details>
        </nav>
    </details>
    <div class="apps-section" th:if="${current == 'complements'}">
        <a class="button" th:href="@{/admin/apps/complements}" th:text="#{complements.offers}">Ofertas</a>
    </div>
</aside>
</html>
