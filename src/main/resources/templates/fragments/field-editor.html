<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="colors(showNames)" class="color-options-editor" hidden
         th:attr="data-name=#{color.option.name},data-color=#{color.option.color},data-add=#{color.option.add},data-remove=#{image.option.remove},data-up=#{image.option.up},data-down=#{image.option.down},data-drag=#{fields.order.drag},data-invalid=#{color.options.invalid}">
    <p class="field-help" th:text="#{color.options.help}"></p>
    <input type="hidden" name="_showColorNames" value="on">
    <label class="checkbox"><input type="checkbox" name="showColorNames" value="true" th:checked="${showNames}"><span th:text="#{color.names.show}"></span></label>
    <div class="color-options-rows"></div>
    <button class="button small color-option-add" type="button" th:text="#{color.option.add}"></button>
    <p class="color-options-status" role="status" aria-live="polite"></p>
</section>
<section th:fragment="validation" class="field-validation">
    <label>
        <span th:text="#{editor.format}"></span>
        <small class="field-help" th:text="#{editor.format.help}"></small>
        <select class="field-format">
            <option value="" th:text="#{editor.format.any}"></option>
            <option value="^[0-9]+$" th:text="#{editor.format.digits}"></option>
            <option value="^[A-Za-zÀ-ÖØ-öø-ÿ ]+$" th:text="#{editor.format.letters}"></option>
            <option value="custom" th:text="#{editor.format.custom}"></option>
        </select>
    </label>
    <details class="field-advanced field-custom-format">
        <summary th:text="#{editor.format.advanced}"></summary>
        <p class="field-help" th:text="#{editor.format.advanced.help}"></p>
        <label>
            <span th:text="#{admin.fields.pattern}"></span>
            <input class="field-pattern" maxlength="255" spellcheck="false" autocomplete="off"
                   th:attr="data-invalid=#{editor.format.invalid}">
        </label>
    </details>
</section>
<section th:fragment="preview" class="field-live-preview"
         th:attr="data-upload-max-mb=${store.effectivePlan.name() == 'PREMIUM_ULTRA' ? 20 : 10},data-upload-help=#{upload.preview.help},data-upload-count=#{upload.preview.count},data-fallback-label=#{admin.fields.preview.fallback},data-select-prompt=#{editor.preview.select},data-image-zoom=#{image.zoom.link}">
    <p class="eyebrow" th:text="#{admin.fields.preview}"></p>
    <p class="field-help" th:text="#{editor.preview.help}"></p>
    <div class="field-preview-control"></div>
</section>
</body>
</html>
