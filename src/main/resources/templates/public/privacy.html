<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{privacy.title} + ' - ' + #{common.app.name}">Politica de Privacidade</title>
    <link rel="stylesheet" th:href="@{/styles/app.css}">
</head>
<body>
<main class="shell public-page legal-page">
    <section class="page-header">
        <div>
            <p class="eyebrow" th:text="#{common.app.name}">Campos Personalizados</p>
            <h1 th:text="#{privacy.title}">Politica de Privacidade</h1>
            <p class="muted" th:text="#{privacy.updated}">Ultima atualizacao</p>
        </div>
        <a class="button" th:href="@{/support/}" th:text="#{common.support}">Suporte</a>
    </section>

    <section class="panel legal-content">
        <h2 th:text="#{privacy.s1.title}">1. Sobre esta politica</h2>
        <p th:text="#{privacy.s1.p1}"></p>
        <p th:text="#{privacy.s1.p2}"></p>

        <h2 th:text="#{privacy.s2.title}">2. Dados tratados</h2>
        <p th:text="#{privacy.s2.p1}"></p>
        <p th:text="#{privacy.s2.p2}"></p>

        <h2 th:text="#{privacy.s3.title}">3. Dados de clientes da loja</h2>
        <p th:text="#{privacy.s3.p1}"></p>

        <h2 th:text="#{privacy.s4.title}">4. Finalidades</h2>
        <p th:text="#{privacy.s4.p1}"></p>

        <h2 th:text="#{privacy.s5.title}">5. Compartilhamento</h2>
        <p th:text="#{privacy.s5.p1}"></p>

        <h2 th:text="#{privacy.s6.title}">6. Retencao e exclusao</h2>
        <p th:utext="#{privacy.s6.p1}"></p>

        <h2 th:text="#{privacy.s7.title}">7. Seguranca</h2>
        <p th:text="#{privacy.s7.p1}"></p>

        <h2 th:text="#{privacy.s8.title}">8. Direitos e contato</h2>
        <p th:text="#{privacy.s8.p1}"></p>
        <p>
            <span th:text="#{privacy.s8.p2.before}"></span>
            <a th:href="@{/support/}" th:text="#{privacy.s8.p2.link}">central de suporte</a><span th:text="#{privacy.s8.p2.after}"></span>
        </p>

        <h2 th:text="#{privacy.s9.title}">9. Alteracoes</h2>
        <p th:text="#{privacy.s9.p1}"></p>
    </section>
</main>
</body>
</html>
