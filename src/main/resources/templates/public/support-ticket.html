<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chamado - Campos Personalizados</title>
    <link rel="stylesheet" th:href="@{/styles/app.css}">
</head>
<body>
<main class="shell public-page">
    <section class="page-header">
        <div>
            <p class="eyebrow" th:text="'Chamado #' + ${ticket.id}">Chamado</p>
            <h1 th:text="${ticket.subject}">Assunto</h1>
        </div>
        <a class="button" th:href="@{/support/}">Voltar ao suporte</a>
    </section>
    <p class="notice" th:if="${message}" th:text="${message}">Mensagem</p>
    <p class="notice error" th:if="${error}" th:text="${error}">Erro</p>

    <section class="conversation">
        <article class="message-card" th:each="item : ${messages}"
                 th:classappend="${item.authorType.name() == 'STORE'} ? ' from-store' : ' from-support'">
            <div class="message-meta">
                <strong th:text="${item.authorType.name() == 'STORE' ? 'Você' : 'Suporte Campos Personalizados'}">Autor</strong>
                <span th:text="${#temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm')}">Data</span>
            </div>
            <p th:text="${item.message}">Mensagem</p>
        </article>
    </section>

    <section class="panel settings-panel" th:if="${ticket.status.name() == 'OPEN'}">
        <h2>Responder</h2>
        <form class="form" th:action="@{/support/tickets/{id}/messages(id=${ticket.id})}" method="post">
            <textarea name="message" rows="6" maxlength="5000" required placeholder="Escreva sua resposta..."></textarea>
            <button class="button primary" type="submit">Enviar resposta</button>
        </form>
    </section>
    <p class="notice warning" th:if="${ticket.status.name() == 'CLOSED'}">Este chamado foi encerrado pelo suporte.</p>
</main>
</body>
</html>
