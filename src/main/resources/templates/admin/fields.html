<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campos - Aplicativo: Campos Personalizados</title>
    <link rel="stylesheet" th:href="@{/styles/app.css}">
</head>
<body>
<main class="shell">
    <section class="page-header">
        <div>
            <p class="eyebrow">Editor</p>
            <h1 th:text="${rule.productName ?: 'Produto ' + rule.productId}">Produto</h1>
        </div>
        <a class="button" th:href="@{/admin/products}">Produtos</a>
    </section>

    <p class="notice" th:if="${message}" th:text="${message}">Mensagem</p>
    <p class="notice error" th:if="${error}" th:text="${error}">Erro</p>

    <section class="panel plan-strip">
        <div>
            <h2 th:text="'Plano ' + ${store.plan}">Plano FREE</h2>
            <p class="muted">
                <span th:text="${usage.fieldsUsed}">0</span>
                <span th:text="${usage.unlimitedFields() ? ' campos neste produto de limite ilimitado' : ' de ' + usage.fieldLimit + ' campos neste produto'}">
                    de 1 campo neste produto
                </span>
            </p>
        </div>
        <a class="button primary" th:href="@{/admin/billing}">Upgrade</a>
    </section>

    <section class="grid two">
        <div class="panel">
            <h2>Novo campo</h2>
            <p class="notice error" th:if="${!canAddField}">Limite de campos atingido para este produto.</p>
            <form class="form preview-source" th:action="@{/admin/products/{productId}/fields(productId=${rule.productId})}"
                  th:object="${fieldForm}" method="post" th:classappend="${!canAddField} ? ' blocked' : ''">
                <label>
                    Label
                    <input th:field="*{label}" maxlength="100" required>
                </label>
                <label>
                    Tipo
                    <select th:field="*{fieldType}" required>
                        <option th:each="type : ${fieldTypes}" th:value="${type}" th:text="${type}">TEXT</option>
                    </select>
                </label>
                <label class="checkbox">
                    <input th:field="*{required}" type="checkbox">
                    Obrigatorio
                </label>
                <label>
                    Maximo de caracteres
                    <input th:field="*{maxLength}" type="number" min="1" max="500" required>
                </label>
                <label>
                    Placeholder
                    <input th:field="*{placeholder}" maxlength="150">
                </label>
                <label>
                    Regex ou mascara
                    <input th:field="*{validationPattern}" maxlength="255" placeholder="Ex: ^[0-9]{1,2}$">
                </label>
                <label>
                    Opcoes do select
                    <textarea th:field="*{optionsText}" rows="4" placeholder="Uma opcao por linha"></textarea>
                </label>
                <label>
                    Ordem
                    <input th:field="*{sortOrder}" type="number" min="0">
                </label>
                <button class="button primary" type="submit" th:disabled="${!canAddField}">Criar campo</button>
            </form>
            <div class="preview-box">
                <h2>Preview</h2>
                <div id="field-preview"></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <h2>Campos configurados</h2>
                <span class="muted" th:text="${#lists.size(rule.fields)} + ' campos'">0 campos</span>
            </div>

            <div class="empty" th:if="${#lists.isEmpty(rule.fields)}">
                Este produto ainda nao tem campos.
            </div>

            <div class="field-list">
                <article class="field-item" th:each="field : ${rule.fields}">
                    <form class="form compact"
                          th:action="@{/admin/products/{productId}/fields/{fieldId}(productId=${rule.productId},fieldId=${field.id})}"
                          method="post">
                        <label>
                            Label
                            <input name="label" th:value="${field.label}" maxlength="100" required>
                        </label>
                        <label>
                            Tipo
                            <select name="fieldType" required>
                                <option th:each="type : ${fieldTypes}"
                                        th:value="${type}"
                                        th:selected="${type == field.fieldType}"
                                        th:text="${type}">TEXT</option>
                            </select>
                        </label>
                        <label class="checkbox">
                            <input name="required" type="checkbox" value="true" th:checked="${field.required}">
                            Obrigatorio
                        </label>
                        <label>
                            Maximo
                            <input name="maxLength" th:value="${field.maxLength}" type="number" min="1" max="500" required>
                        </label>
                        <label>
                            Placeholder
                            <input name="placeholder" th:value="${field.placeholder}" maxlength="150">
                        </label>
                        <label>
                            Regex ou mascara
                            <input name="validationPattern" th:value="${field.validationPattern}" maxlength="255">
                        </label>
                        <label>
                            Opcoes do select
                            <textarea name="optionsText" rows="4" th:text="${field.optionsText}"></textarea>
                        </label>
                        <label>
                            Ordem
                            <input name="sortOrder" th:value="${field.sortOrder}" type="number" min="0">
                        </label>
                        <div class="row-actions">
                            <button class="button primary small" type="submit">Salvar</button>
                        </div>
                    </form>
                    <form th:action="@{/admin/products/{productId}/fields/{fieldId}/delete(productId=${rule.productId},fieldId=${field.id})}"
                          method="post">
                        <button class="button danger small" type="submit">Excluir campo</button>
                    </form>
                </article>
            </div>
        </div>
    </section>
</main>
<script>
    const source = document.querySelector(".preview-source");
    const preview = document.getElementById("field-preview");

    function updatePreview() {
        if (!source || !preview) {
            return;
        }
        const label = source.querySelector("[name='label']").value || "Campo";
        const type = source.querySelector("[name='fieldType']").value;
        const placeholder = source.querySelector("[name='placeholder']").value || "";
        const required = source.querySelector("[name='required']").checked;
        const maxLength = source.querySelector("[name='maxLength']").value;
        const optionsText = source.querySelector("[name='optionsText']").value || "";

        preview.innerHTML = "";
        const wrapper = document.createElement("label");
        wrapper.className = "ncf-field";
        const text = document.createElement("span");
        text.className = "ncf-label";
        text.textContent = label + (required ? " *" : "");
        wrapper.appendChild(text);

        let input;
        if (type === "TEXTAREA") {
            input = document.createElement("textarea");
        } else if (type === "SELECT") {
            input = document.createElement("select");
            optionsText.split(/\r?\n/).filter(Boolean).forEach((value) => {
                const option = document.createElement("option");
                option.textContent = value;
                input.appendChild(option);
            });
        } else {
            input = document.createElement("input");
            input.type = type === "NUMBER" ? "number" : "text";
        }
        input.placeholder = placeholder;
        if (maxLength) {
            input.maxLength = Number(maxLength);
        }
        wrapper.appendChild(input);
        preview.appendChild(wrapper);
    }

    if (source) {
        source.addEventListener("input", updatePreview);
        source.addEventListener("change", updatePreview);
        updatePreview();
    }
</script>
</body>
</html>
