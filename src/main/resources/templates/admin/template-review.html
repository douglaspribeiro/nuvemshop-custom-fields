<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{template.review}"></title><link rel="stylesheet" th:href="@{/styles/app.css(v=${assetVersion})}"><link rel="stylesheet" th:href="@{/styles/merchant.css(v=${assetVersion})}"></head>
<body class="merchant-page"><th:block th:replace="~{fragments/merchant-shell :: navigation('templates')}"></th:block><main class="shell"><section class="page-header"><div><h1 th:text="#{template.review}"></h1><p th:text="${product.name}"></p></div><a class="button" href="/admin/templates" th:text="#{template.library}"></a></section>
<div class="template-grid"><section class="panel"><h2 th:text="#{template.current}"></h2><p th:if="${#lists.isEmpty(preview.existing)}" th:text="#{template.no.fields}"></p><div th:each="field : ${preview.existing}" th:insert="~{fragments/template-definition :: definition}"></div></section>
<section class="panel"><h2 th:text="${preview.template.name}"></h2><div th:each="field : ${preview.template.fields}" th:insert="~{fragments/template-definition :: definition}"></div></section></div>
<section class="panel"><p th:text="#{template.independent}"></p><form id="template-apply" class="form" th:attr="data-key=${preview.template.key},data-product-id=${product.id},data-review-token=${preview.reviewToken},data-request-id=${requestId}">
<label class="checkbox"><input type="radio" name="mode" value="APPEND" required><span th:text="#{template.append}"></span></label><label class="checkbox"><input type="radio" name="mode" value="REPLACE" required><span th:text="#{template.replace}"></span></label>
<label class="checkbox" id="template-replace-confirm" hidden><input name="confirmed" type="checkbox"><span th:text="#{template.replace.confirm}"></span></label><button class="button primary" type="submit" th:text="#{template.apply}"></button><p id="template-status" role="status" aria-live="polite"></p></form></section>
</main><div id="template-ui" hidden th:attr="data-failed=#{template.failed},data-saved=#{template.saved}"></div><script th:src="@{/assets/store-templates.js(v=${assetVersion})}" defer></script><th:block th:replace="~{fragments/nexo :: adminBridge}"></th:block></body></html>
