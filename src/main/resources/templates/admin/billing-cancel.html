<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{admin.billing.cancel.title} + ' - ' + #{common.app.title}">Cancelar assinatura</title>
    <th:block th:replace="~{fragments/analytics :: googleAnalytics}"></th:block>
    <link rel="stylesheet" th:href="@{/styles/app.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/styles/merchant.css(v=${assetVersion})}">
</head>
<body class="merchant-page">
<th:block th:replace="~{fragments/merchant-shell :: navigation('billing')}"></th:block>
<main class="shell merchant-billing-cancel">
    <a class="merchant-cancel-back" th:href="@{/admin/billing}" th:text="#{admin.billing.cancel.back}">Voltar aos planos</a>
    <section class="panel">
        <p class="eyebrow" th:text="#{admin.billing.manage}">Gerenciar assinatura</p>
        <h1 th:text="#{admin.billing.cancel.title}">Tem certeza de que deseja cancelar a assinatura?</h1>
        <p th:text="#{admin.billing.cancel.no.renewal}">Você não receberá uma nova cobrança após o cancelamento.</p>
        <p th:if="${paymentSubscription.nextPaymentAt != null}"
           th:with="endDate=${#temporals.format(paymentSubscription.nextPaymentAt, 'dd/MM/yyyy', 'America/Sao_Paulo')}"
           th:text="#{admin.billing.cancel.period(${endDate})}">Seu plano continua disponível até 24/10/2026.</p>
        <p th:unless="${paymentSubscription.nextPaymentAt != null}"
           th:text="#{admin.billing.cancel.period.unavailable}">Vamos confirmar o fim do período pago antes de cancelar.</p>
        <form th:action="@{/admin/billing/cancel}" method="post">
            <label class="merchant-cancel-confirm">
                <input type="checkbox" name="confirm" value="true" required>
                <span th:text="#{admin.billing.cancel.confirm}">Sim, tenho certeza de que quero cancelar a assinatura.</span>
            </label>
            <div class="merchant-cancel-actions">
                <a class="button primary" th:href="@{/admin/billing}" th:text="#{admin.billing.cancel.keep}">Manter minha assinatura</a>
                <button class="button" type="submit" th:text="#{admin.billing.cancel.confirm.action}">Confirmar cancelamento</button>
            </div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/nexo :: adminBridge}"></th:block>
</body>
</html>
