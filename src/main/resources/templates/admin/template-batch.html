<!doctype html><html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="#{batch.title}"></title><link rel="stylesheet" th:href="@{/styles/app.css(v=${assetVersion})}"><link rel="stylesheet" th:href="@{/styles/merchant.css(v=${assetVersion})}"></head>
<body class="merchant-page"><th:block th:replace="~{fragments/merchant-shell :: navigation('templates')}"></th:block><main class="shell" id="template-batch" th:attr="data-key=${batchKey},data-batch-id=${batchId}">
<section class="page-header"><div><h1 th:text="#{batch.title}"></h1><p th:text="#{batch.intro}"></p></div><a class="button" href="/admin/templates" th:text="#{template.library}"></a></section>
<p id="batch-status" role="status" aria-live="polite"></p>
<p><strong th:text="${batchName}"></strong></p>
<section class="panel" id="batch-selection">
 <div class="form batch-filters"><label><span th:text="#{batch.search}"></span><input type="search" id="batch-search"></label><label><span th:text="#{batch.category}"></span><select id="batch-category"></select></label><label><span th:text="#{batch.brand}"></span><select id="batch-brand"></select></label><label><span th:text="#{batch.configuration}"></span><select id="batch-config"><option value="all" th:text="#{batch.all}"></option><option value="configured" th:text="#{batch.configured}"></option><option value="unconfigured" th:text="#{batch.unconfigured}"></option><option value="linked" th:text="#{batch.linked}"></option></select></label></div>
 <p class="muted" th:text="#{batch.selectionHint}"></p><div class="row-actions"><button type="button" class="button" id="batch-select-all" th:text="#{batch.selectAll}"></button><strong id="batch-count"></strong></div><div id="batch-products" class="batch-products"></div>
 <label><span th:text="#{template.review}"></span><select id="batch-mode"><option value="APPEND" th:text="#{batch.append}"></option><option value="REPLACE" th:text="#{batch.replace}"></option><option value="UPDATE" th:text="#{batch.update}"></option></select></label>
 <button type="button" class="button primary" id="batch-review" th:text="#{batch.review}"></button>
</section>
<section class="panel" id="batch-review-panel" hidden><h2 th:text="#{template.review}"></h2><p class="muted" th:text="#{batch.selectionHint}"></p><div id="batch-review-items"></div><label class="checkbox"><input type="checkbox" id="batch-confirm"><span th:text="#{batch.replaceConfirm}"></span></label><div class="row-actions"><button type="button" class="button primary" id="batch-execute" th:text="#{batch.execute}"></button><button type="button" class="button" id="batch-new-review" th:text="#{batch.refresh}"></button></div></section>
<section class="panel"><h2 th:text="#{batch.history}"></h2><div id="batch-history"></div></section>
</main><script th:inline="javascript">window.ncfTemplateBatchUi=/*[[${batchUi}]]*/ {};</script><script th:src="@{/assets/template-batch.js(v=${assetVersion})}" defer></script><th:block th:replace="~{fragments/nexo :: adminBridge}"></th:block><th:block th:replace="~{fragments/merchant-shell :: footer}"></th:block></body></html>
