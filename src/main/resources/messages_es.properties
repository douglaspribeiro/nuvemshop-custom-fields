privacy.title=Política de Privacidad
privacy.updated=Última actualización: 12 de junio de 2026
privacy.s1.title=1. Sobre esta política
privacy.s1.p1=Esta política explica cómo la aplicación Campos Personalizados trata los datos al ser instalada y utilizada en una tienda Nuvemshop.
privacy.s1.p2=Campos Personalizados es responsable del tratamiento realizado directamente para la prestación de la aplicación. Nuvemshop tiene sus propias responsabilidades y políticas para los datos tratados en su plataforma.
privacy.s2.title=2. Datos tratados
privacy.s2.p1=Podemos tratar el identificador y nombre de la tienda, token de acceso, permisos concedidos, plan contratado, información de cobro, configuraciones de campos personalizados, productos asociados, preferencias visuales, logs técnicos y mensajes enviados al soporte.
privacy.s2.p2=Cuando la tienda lo autoriza, la aplicación consulta productos, scripts, webhooks y pedidos mediante la API de Nuvemshop. En los pedidos, la lectura se limita a la información necesaria para presentar reportes sobre personalizaciones.
privacy.s3.title=3. Datos de clientes de la tienda
privacy.s3.p1=Los valores completados por los consumidores en los campos personalizados se envían a la propia tienda mediante los recursos de carrito y pedido de Nuvemshop. La aplicación no mantiene una base propia de esos valores, salvo cuando la información sea incluida voluntariamente en un mensaje de soporte o log técnico.
privacy.s4.title=4. Finalidades
privacy.s4.p1=Usamos los datos para autenticar la tienda, proveer y personalizar el servicio, aplicar límites del plan, registrar scripts y webhooks, procesar suscripciones, presentar reportes, prevenir fallas, brindar soporte y cumplir obligaciones legales.
privacy.s5.title=5. Compartición de datos
privacy.s5.p1=Los datos pueden ser procesados por Nuvemshop y por proveedores de infraestructura estrictamente necesarios para la operación, alojamiento, base de datos y monitoreo. No vendemos datos personales ni los utilizamos para publicidad de terceros.
privacy.s6.title=6. Retención y eliminación
privacy.s6.p1=Los datos permanecen almacenados mientras la integración esté activa y durante el período necesario para soporte, auditoría, seguridad y obligaciones legales. Después de la desinstalación, el token y los permisos de acceso se eliminan de inmediato. Al recibir de Nuvemshop una solicitud <code>store/redact</code>, la aplicación elimina definitivamente los registros vinculados a la tienda.
privacy.s7.title=7. Seguridad
privacy.s7.p1=Adoptamos controles técnicos y organizativos razonables, incluyendo acceso restringido, comunicación HTTPS y validación de firmas de webhooks. Ningún sistema es totalmente inmune a incidentes, pero trabajamos para reducir riesgos y responder adecuadamente.
privacy.s8.title=8. Derechos y contacto
privacy.s8.p1=La tienda y los titulares pueden solicitar confirmación del tratamiento, acceso, corrección, portabilidad, oposición o eliminación de datos, cuando esos derechos sean aplicables y respetando las obligaciones legales y técnicas.
privacy.s8.p2.before=Las solicitudes y dudas sobre privacidad deben enviarse por nuestro
privacy.s8.p2.link=centro de soporte
privacy.s8.p2.after=. Podremos pedir información adicional para confirmar la identidad y evitar accesos indebidos.
privacy.s9.title=9. Alteraciones
privacy.s9.p1=Esta política podrá ser actualizada para reflejar cambios en la aplicación, en la legislación o en los servicios utilizados. La fecha de la versión vigente será informada al inicio de esta página.
